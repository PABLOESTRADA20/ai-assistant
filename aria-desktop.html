<!DOCTYPE html>
<html class="dark" lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ARIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
        "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #e6e6e6;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    textarea,
    input {
      -webkit-user-select: text;
      user-select: text;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    .glass {
      background: rgba(13, 14, 20, 0.78);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border: 1px solid rgba(239, 68, 68, 0.28);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55), 0 0 24px rgba(239, 68, 68, 0.18);
    }

    .glass-light {
      background: rgba(13, 14, 20, 0.68);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      border: 1px solid rgba(239, 68, 68, 0.22);
    }

    .text-sub {
      color: #b9a7ac;
    }

    .text-faint {
      color: #7e6b71;
    }

    .accent {
      color: #fb7185;
    }

    .chat-scroll::-webkit-scrollbar {
      display: none;
    }

    .chat-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .halo {
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(74vw, 640px);
      height: min(74vw, 640px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, rgba(153, 27, 27, 0.06) 45%, transparent 70%);
      filter: blur(28px);
      pointer-events: none;
      animation: breathe 4.2s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 0.7;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.06);
      }
    }

    .scan {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 60, 90, 0.85), transparent);
      box-shadow: 0 0 14px rgba(255, 60, 90, 0.7);
      animation: slide 5.5s linear infinite;
      pointer-events: none;
      opacity: 0.9;
      z-index: 0;
    }

    @keyframes slide {
      0% {
        transform: translateY(0);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      88% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    .vig {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(3, 4, 6, 0.72) 100%);
      z-index: 0;
    }
  </style>
</head>

<body>
  <div class="halo"></div>
  <div class="scan"></div>
  <div class="vig"></div>
  <div id="stage"></div>

  <!-- HUD superior -->
  <header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 sm:px-6 py-3">
    <div class="glass flex items-center gap-2 px-3 py-1.5 rounded-full">
      <span class="w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_8px_#fb7185] animate-pulse"></span>
      <span class="text-[10px] tracking-[0.18em] uppercase text-faint">ARIA • ASISTENTE IA</span>
    </div>
    <div class="glass-light flex items-center gap-1.5 px-2.5 py-1 rounded-full">
      <span class="material-symbols-outlined text-[16px] accent">neurology</span>
      <span class="text-[11px] uppercase tracking-[0.16em] text-sub">Modelo: GPT-OSS 120B</span>
    </div>
  </header>

  <!-- Panel lateral izquierdo (conversaciones) -->
  <aside class="fixed left-0 top-14 bottom-0 z-20 w-[88px] sm:w-[280px] flex flex-col gap-2 px-2 sm:px-3 py-2">
    <button class="glass flex items-center gap-2 px-2 sm:px-3 py-2 rounded-xl w-full justify-center sm:justify-start">
      <span class="material-symbols-outlined text-[18px] accent">add</span>
      <span class="hidden sm:inline text-[12px] uppercase tracking-[0.14em] text-sub">Nueva conversación</span>
    </button>
    <div class="glass-light flex-1 rounded-xl p-1 sm:p-2 flex flex-col gap-1 overflow-y-auto chat-scroll">
      <div class="flex items-center gap-2 px-2 py-1.5 rounded-lg bg-white/5">
        <span class="material-symbols-outlined text-[16px] accent">chat_bubble</span>
        <span class="hidden sm:inline text-[12px] text-sub truncate">Bienvenida a ARIA</span>
      </div>
      <div class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-white/5">
        <span class="material-symbols-outlined text-[16px] text-faint">chat_bubble</span>
        <span class="hidden sm:inline text-[12px] text-faint truncate">Proyecto actual</span>
      </div>
    </div>
  </aside>

  <!-- Chat centrado -->
  <main class="fixed inset-0 z-10 flex flex-col items-center justify-between px-2 sm:px-6 pt-16 pb-6 pointer-events-none">
    <div class="w-full max-w-3xl flex-1 flex flex-col gap-3 overflow-y-auto chat-scroll py-4 pointer-events-auto">
      <div class="flex justify-start">
        <div class="glass-light max-w-[90%] sm:max-w-[78%] px-4 py-2.5 rounded-2xl rounded-tl-none">
          <p class="text-[13px] sm:text-[14px] leading-relaxed text-sub">
            Hola, soy ARIA. Estoy aquí para ayudarte con código, análisis y respuestas claras.
          </p>
        </div>
      </div>
      <div class="flex justify-end">
        <div class="glass max-w-[90%] sm:max-w-[78%] px-4 py-2.5 rounded-2xl rounded-tr-none">
          <p class="text-[13px] sm:text-[14px] leading-relaxed">
            Muéstrame el diseño limpio para PC/celular
          </p>
        </div>
      </div>
    </div>

    <div class="w-full max-w-3xl pointer-events-auto">
      <div class="glass flex items-end gap-2 px-2 sm:px-3 py-1.5 rounded-full">
        <textarea rows="1" placeholder="Preguntá cualquier cosa..." class="flex-1 bg-transparent text-[13px] sm:text-[14px] text-sub placeholder:text-faint resize-none focus:outline-none px-2 py-1.5 max-h-36"></textarea>
        <button class="p-2 rounded-full hover:bg-white/5">
          <span class="material-symbols-outlined text-[18px] accent">send</span>
        </button>
      </div>
      <div class="mt-1.5 flex justify-center">
        <span class="text-[10px] uppercase tracking-[0.14em] text-faint">Presiona Enter para enviar • Shift+Enter para salto de línea</span>
      </div>
    </div>
  </main>

  <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
  <script>
    (function () {
      var stage = document.getElementById('stage');
      var isNarrow = Math.min(window.innerWidth, window.innerHeight) < 680;
      var dpr = window.devicePixelRatio || 1;

      var W = function () { return stage.clientWidth || window.innerWidth; };
      var H = function () { return stage.clientHeight || window.innerHeight; };

      var scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050407, 0.024);

      var CAM = isNarrow ? { pos: [0, 1.2, 6.6], fov: 48 } : { pos: [0, 1.4, 5.4], fov: 40 };
      var camera = new THREE.PerspectiveCamera(CAM.fov, W() / H(), 0.1, 110);
      camera.position.set(CAM.pos[0], CAM.pos[1], CAM.pos[2]);

      var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(dpr, 2));
      renderer.setSize(W(), H());
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.setClearColor(0x000000, 0);
      stage.appendChild(renderer.domElement);

      function envTexture() {
        var c = document.createElement('canvas');
        c.width = 512; c.height = 256;
        var g = c.getContext('2d');
        var grd = g.createLinearGradient(0, 0, 0, 256);
        grd.addColorStop(0.00, '#3a0d1a');
        grd.addColorStop(0.40, '#15131a');
        grd.addColorStop(0.60, '#1a1922');
        grd.addColorStop(1.00, '#000000');
        g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
        var t = new THREE.CanvasTexture(c);
        t.mapping = THREE.EquirectangularReflectionMapping;
        return t;
      }
      var pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromEquirectangular(envTexture()).texture;

      var ambient = new THREE.AmbientLight(0x2a0d16, 0.7);
      scene.add(ambient);
      var hemi = new THREE.HemisphereLight(0x8ea8d8, 0x140306, 0.4);
      scene.add(hemi);
      var key = new THREE.DirectionalLight(0xffffff, 1.9);
      key.position.set(4, 5, 4);
      scene.add(key);
      var rim = new THREE.DirectionalLight(0xff2244, 3.0);
      rim.position.set(-4.5, 3, -4);
      scene.add(rim);

      var floor = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshStandardMaterial({ color: 0x09080d, metalness: 0.9, roughness: 0.24, envMapIntensity: 0.9 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      var grid = new THREE.GridHelper(50, 40, 0xff0033, 0x1c0b11);
      grid.position.y = 0.02;
      grid.material.transparent = true;
      grid.material.opacity = 0.14;
      scene.add(grid);

      var car = new THREE.Group();
      scene.add(car);

      var paint = new THREE.MeshStandardMaterial({ color: 0xe6ebf2, metalness: 0.93, roughness: 0.20, envMapIntensity: 1.6 });
      var glass = new THREE.MeshPhysicalMaterial({ color: 0x06070a, metalness: 0.08, roughness: 0.05, transparent: true, opacity: 0.56, envMapIntensity: 2.2 });
      var gold = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 1.0, roughness: 0.22, envMapIntensity: 1.6 });
      var rubber = new THREE.MeshStandardMaterial({ color: 0x101114, metalness: 0.05, roughness: 0.92 });

      var bodyGeo = new THREE.BoxGeometry(2.00, 0.22, 3.80);
      var body = new THREE.Mesh(bodyGeo, paint);
      body.position.y = 0.41;
      car.add(body);

      var noseGeo = new THREE.CylinderGeometry(0.48, 1.18, 0.44, 4);
      noseGeo.rotateY(Math.PI / 4);
      var nose = new THREE.Mesh(noseGeo, paint);
      nose.position.set(0, 0.37, 1.48);
      nose.scale.set(1, 0.6, 1.6);
      car.add(nose);

      var cabGeo = new THREE.CylinderGeometry(0.90, 1.20, 0.44, 4);
      cabGeo.rotateY(Math.PI / 4);
      var cab = new THREE.Mesh(cabGeo, glass);
      cab.position.set(0, 0.64, -0.08);
      cab.scale.set(1, 1, 1.6);
      car.add(cab);

      var roof = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.05, 0.98), paint);
      roof.position.set(-0.18, 0.88, -0.08);
      roof.rotation.z = 0.02;
      car.add(roof);

      var tires = [];
      [[1.22, 0.37, 1.16], [1.22, 0.37, -1.18], [-1.22, 0.37, 1.16], [-1.22, 0.37, -1.18]].forEach(function (p) {
        var g = new THREE.Group();
        g.position.set(p[0], p[1], p[2]);
        var t = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.26, 22), rubber);
        t.rotation.z = Math.PI / 2;
        var r = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.18, 16), gold);
        r.rotation.z = Math.PI / 2;
        g.add(t); g.add(r);
        for (var s = 0; s < 5; s++) {
          var sp = new THREE.Mesh(new THREE.BoxGeometry(0.048, 0.40, 0.08), gold);
          sp.rotation.x = (s / 5) * Math.PI;
          g.add(sp);
        }
        car.add(g);
        tires.push(t);
      });

      var cage = new THREE.LineSegments(
        new THREE.WireframeGeometry(new THREE.BoxGeometry(2.20, 0.66, 4.20)),
        new THREE.LineBasicMaterial({ color: 0xff0044, transparent: true, opacity: 0.18 })
      );
      cage.position.y = 0.48;
      car.add(cage);

      var ring1G = new THREE.RingGeometry(2.5, 2.55, 52);
      ring1G.rotateX(-Math.PI / 2);
      var ring1 = new THREE.Mesh(ring1G, new THREE.MeshBasicMaterial({ color: 0xff1144, side: THREE.DoubleSide, transparent: true, opacity: 0.30 }));
      ring1.position.y = 0.05;
      scene.add(ring1);

      var ring2G = new THREE.RingGeometry(3.2, 3.23, 52);
      ring2G.rotateX(-Math.PI / 2);
      var ring2 = new THREE.Mesh(ring2G, new THREE.MeshBasicMaterial({ color: 0xff3366, side: THREE.DoubleSide, transparent: true, opacity: 0.18 }));
      ring2.position.y = 0.04;
      scene.add(ring2);

      var clock = new THREE.Clock();
      function resize() {
        var w = W(), h = H();
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', function () { setTimeout(resize, 150); });

      function animate() {
        requestAnimationFrame(animate);
        var t = clock.getElapsedTime();
        car.rotation.y = t * 0.14;
        car.rotation.x = Math.sin(t * 0.5) * 0.014;
        car.position.y = Math.sin(t * 1.1) * 0.016;
        tires.forEach(function (x) { x.rotation.x -= 0.015; });
        ring1.rotation.z = t * 0.16;
        ring2.rotation.z = -t * 0.12;
        cage.material.opacity = 0.14 + Math.sin(t * 2.4) * 0.1;
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>

</html>
