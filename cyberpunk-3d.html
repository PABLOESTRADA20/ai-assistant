<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ARIA</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07080b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;width:100%;height:100%;}
  canvas{display:block;touch-action:none;}

  /* ---- HUD: solo botones, cero texto ---- */
  .hud{position:fixed;inset:0;z-index:20;pointer-events:none;}
  .hud > *{pointer-events:auto;}

  .bar-top{
    position:absolute;top:18px;right:18px;
    display:flex;gap:10px;
  }
  .orb{
    width:46px;height:46px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(13,14,20,.72);
    border:1px solid rgba(239,68,68,.35);
    box-shadow:0 0 18px rgba(239,68,68,.22), inset 0 0 18px rgba(239,68,68,.08);
    backdrop-filter:blur(14px);
    cursor:pointer;transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    color:#f87171;font-size:20px;line-height:1;user-select:none;
  }
  .orb:hover{border-color:rgba(239,68,68,.7);box-shadow:0 0 26px rgba(239,68,68,.4), inset 0 0 22px rgba(239,68,68,.14);}
  .orb:active{transform:scale(.9);}

  .bar-bottom{
    position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;gap:12px;
  }
  .chip{
    min-width:56px;height:56px;padding:0 18px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:rgba(13,14,20,.72);
    border:1px solid rgba(239,68,68,.32);
    box-shadow:0 0 22px rgba(239,68,68,.18), inset 0 0 18px rgba(239,68,68,.06);
    backdrop-filter:blur(16px);
    cursor:pointer;transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    color:#fb7185;
  }
  .chip:hover{border-color:rgba(239,68,68,.7);box-shadow:0 0 30px rgba(239,68,68,.38), inset 0 0 22px rgba(239,68,68,.12);}
  .chip:active{transform:scale(.94);}
  .chip svg{width:22px;height:22px;display:block;}

  /*cyberpunk: anillo neon pulsante detrás del auto */
  .halo{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(72vw,620px);height:min(72vw,620px);border-radius:50%;
    background:radial-gradient(circle, rgba(239,68,68,.16) 0%, rgba(153,27,27,.07) 45%, transparent 70%);
    filter:blur(28px);pointer-events:none;
    animation:breathe 4.2s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06);}}

  /* barra de escaneo superior, detalle synthwave */
  .scan{
    position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,60,90,.9),transparent);
    box-shadow:0 0 14px rgba(255,60,90,.8);
    animation:slide 5.5s linear infinite;pointer-events:none;
  }
  @keyframes slide{0%{transform:translateY(0);opacity:0;}12%{opacity:1;}88%{opacity:1;}100%{transform:translateY(100vh);opacity:0;}}

  .vig{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(3,4,6,.72) 100%);
  }
</style>
</head>
<body>

<div id="stage"></div>

<!-- HUD sin texto: solo botones -->
<div class="hud">
  <div class="halo"></div>
  <div class="scan"></div>
  <div class="vig"></div>

  <div class="bar-top">
    <button class="orb" id="spin" title="Rotar" aria-label="Rotar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>

  <div class="bar-bottom">
    <button class="chip" id="reset" aria-label="Reiniciar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
      </svg>
    </button>
    <button class="chip" id="holo" aria-label="Holograma">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>
      </svg>
    </button>
    <button class="chip" id="light" aria-label="Luz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
      </svg>
    </button>
  </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<script>
(function(){
  const stage = document.getElementById('stage');
  const dpr = window.devicePixelRatio || 1;

  // ---------- Responsive: se adapta a PC y celular ----------
  const isNarrow = window.matchMedia('(max-width: 720px)').matches;
  const CAM = isNarrow ? {pos:[0,2.6,7.4], fov:52} : {pos:[0,2.2,5.8], fov:45};
  const CAR_SCALE = isNarrow ? 0.92 : 1.0;

  const W = () => stage.clientWidth || window.innerWidth;
  const H = () => stage.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x06070a, 0.035);

  const camera = new THREE.PerspectiveCamera(CAM.fov, W()/H(), 0.1, 100);
  camera.position.set(CAM.pos[0], CAM.pos[1], CAM.pos[2]);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(dpr, isNarrow ? 2 : 2));
  renderer.setSize(W(), H());
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  stage.appendChild(renderer.domElement);

  // ---------- Luces ----------
  const ambient = new THREE.AmbientLight(0x221118, 1.2); scene.add(ambient);
  const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(4,6,4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xff2244, 4.0); rim.position.set(-5,4,-4); scene.add(rim);
  const top = new THREE.PointLight(0xffeedd, 2.0, 15); top.position.set(0,4,0); scene.add(top);
  const underglow = new THREE.PointLight(0xff0033, 5.0, 6); underglow.position.set(0,0.15,0); scene.add(underglow);

  // ---------- Materiales ----------
  const carPaint = new THREE.MeshPhongMaterial({color:0xe6e9ee, specular:0xff3355, shininess:90, flatShading:true});
  const carbon   = new THREE.MeshPhongMaterial({color:0x111316, specular:0x444444, shininess:40});
  const glass    = new THREE.MeshPhongMaterial({color:0x050608, specular:0xff2244, shininess:120, transparent:true, opacity:.82});
  const neonRed  = new THREE.MeshBasicMaterial({color:0xff0044});
  const headGlow = new THREE.MeshBasicMaterial({color:0x99ddff});
  const wheel    = new THREE.MeshPhongMaterial({color:0x181a1f, specular:0x777777, shininess:60});
  const rimGold  = new THREE.MeshPhongMaterial({color:0xd4af37, specular:0xffeedd, shininess:100});

  // ---------- Auto (se mantiene) ----------
  const car = new THREE.Group();
  scene.add(car);

  const lower = new THREE.Mesh(new THREE.BoxGeometry(1.9,.32,4.2), carPaint);
  lower.position.y = .36; car.add(lower);

  const noseG = new THREE.CylinderGeometry(0.7,1.85,1.2,4); noseG.rotateY(Math.PI/4);
  const nose = new THREE.Mesh(noseG, carPaint);
  nose.position.set(0,.3,1.85); nose.scale.set(1,.3,1.3); car.add(nose);

  const cabG = new THREE.CylinderGeometry(1.15,1.65,.58,4); cabG.rotateY(Math.PI/4);
  const cabin = new THREE.Mesh(cabG, glass);
  cabin.position.set(0,.72,-.15); cabin.scale.set(1,1,1.4); car.add(cabin);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.2,.06,1.4), carPaint);
  roof.position.set(0,1.02,-.15); car.add(roof);

  const deck = new THREE.Mesh(new THREE.BoxGeometry(1.68,.15,1.5), carbon);
  deck.position.set(0,.54,-1.35); car.add(deck);

  [-0.92,.92].forEach(x=>{
    const duct = new THREE.Mesh(new THREE.BoxGeometry(.18,.35,.85), carbon);
    duct.position.set(x,.5,-.3); car.add(duct);
  });

  [-0.65,.65].forEach(x=>{
    const hl = new THREE.Mesh(new THREE.BoxGeometry(.35,.05,.15), headGlow);
    hl.position.set(x,.44,2.3); car.add(hl);
  });

  const rear = new THREE.Mesh(new THREE.BoxGeometry(1.65,.06,.08), neonRed);
  rear.position.set(0,.52,-2.12); car.add(rear);

  const diff = new THREE.Mesh(new THREE.BoxGeometry(1.7,.16,.4), carbon);
  diff.position.set(0,.22,-2.1); car.add(diff);

  const wheelG = new THREE.CylinderGeometry(.36,.36,.28,24); wheelG.rotateZ(Math.PI/2);
  const rimD   = new THREE.TorusGeometry(.24,.04,8,16); rimD.rotateY(Math.PI/2);
  const wheels = [];
  [[-.95,.34,1.35],[.95,.34,1.35],[-.98,.35,-1.35],[.98,.35,-1.35]].forEach(p=>{
    const g = new THREE.Group();
    g.add(new THREE.Mesh(wheelG, wheel));
    g.add(new THREE.Mesh(rimD, rimGold));
    g.position.set(p[0],p[1],p[2]);
    car.add(g); wheels.push(g);
  });

  // ---------- Efectos ----------
  const wireCage = new THREE.LineSegments(
    new THREE.WireframeGeometry(new THREE.BoxGeometry(2.1,.9,4.6)),
    new THREE.LineBasicMaterial({color:0xff0044, transparent:true, opacity:.35})
  );
  wireCage.position.y = .58; car.add(wireCage);

  const ring1G = new THREE.RingGeometry(2.8,2.85,64); ring1G.rotateX(-Math.PI/2);
  const ring1 = new THREE.Mesh(ring1G, new THREE.MeshBasicMaterial({color:0xff1144, side:THREE.DoubleSide, transparent:true, opacity:.5}));
  ring1.position.y = .05; scene.add(ring1);

  const ring2G = new THREE.RingGeometry(3.6,3.63,64); ring2G.rotateX(-Math.PI/2);
  const ring2 = new THREE.Mesh(ring2G, new THREE.MeshBasicMaterial({color:0xff3366, side:THREE.DoubleSide, transparent:true, opacity:.3}));
  ring2.position.y = .04; scene.add(ring2);

  const grid = new THREE.GridHelper(30, 40, 0xff0033, 0x1f0d14);
  grid.position.y = .01; scene.add(grid);

  const N = isNarrow ? 90 : 180;
  const pG = new THREE.BufferGeometry();
  const pP = new Float32Array(N*3);
  for (let i=0;i<N*3;i+=3){ pP[i]=(Math.random()-.5)*12; pP[i+1]=Math.random()*4; pP[i+2]=(Math.random()-.5)*12; }
  pG.setAttribute('position', new THREE.BufferAttribute(pP,3));
  const parts = new THREE.Points(pG, new THREE.PointsMaterial({color:0xff2255, size:.04, transparent:true, opacity:.75, blending:THREE.AdditiveBlending}));
  scene.add(parts);

  // ---------- Estado de la cámara ----------
  let targetY = .45, targetX = .12, rotY = .45, rotX = .12;
  let dragging = false, lastX = 0, lastY = 0;

  // Pointer Events: un solo camino para mouse y dedo (PC + celular)
  const down = e => { dragging = true; lastX = e.clientX; lastY = e.clientY; };
  const move = e => {
    if (!dragging) {
      targetY += ((e.clientX/window.innerWidth) - .5) * .005;
      return;
    }
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    targetY += dx * .008;
    targetX = Math.max(-.2, Math.min(.65, targetX + dy * .005));
    lastX = e.clientX; lastY = e.clientY;
  };
  const up = () => { dragging = false; };

  stage.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);

  function resetCam(){
    rotY = targetY = .45;
    rotX = targetX = .12;
    camera.position.set(CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  }
  document.getElementById('reset').addEventListener('click', resetCam);
  document.getElementById('spin').addEventListener('click', resetCam);

  let holo = true;
  document.getElementById('holo').addEventListener('click', () => {
    holo = !holo;
    wireCage.visible = holo;
    ring1.visible = ring2.visible = holo;
  });

  let studio = true;
  document.getElementById('light').addEventListener('click', () => {
    studio = !studio;
    if (studio){
      ambient.color.setHex(0x221118); ambient.intensity = 1.2;
      key.intensity = 2.5; rim.intensity = 4.0; top.intensity = 2.0;
    } else {
      ambient.color.setHex(0x3a0a14); ambient.intensity = 1.5;
      key.intensity = 1.2; rim.intensity = 6.0; top.intensity = .6;
    }
  });

  // ---------- Loop ----------
  const clock = new THREE.Clock();

  function resize(){
    const w = W(), h = H();
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if (!dragging) targetY += .0035;

    rotY += (targetY - rotY) * .06;
    rotX += (targetX - rotX) * .06;

    car.rotation.y = rotY;
    car.rotation.x = rotX;
    car.rotation.z = Math.sin(t*.9) * .012;         // balanceo sutil
    car.position.y = Math.sin(t*1.5) * .04;
    car.scale.setScalar(CAR_SCALE);

    wheels.forEach(w => { w.children[0].rotation.x += .02; w.children[1].rotation.x += .02; });

    ring1.rotation.z = t*.2;
    ring2.rotation.z = -t*.15;
    wireCage.material.opacity = .25 + Math.sin(t*3)*.15;
    underglow.intensity = 4 + Math.sin(t*4)*1.8;

    const arr = parts.geometry.attributes.position.array;
    for (let i=1;i<N*3;i+=3){ arr[i] += .004; if (arr[i] > 4.5) arr[i] = 0; }
    parts.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
