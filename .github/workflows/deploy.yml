name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: ./ai-assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./ai-assistant/package-lock.json

      - name: Install dependencies
        env:
          NODE_ENV: development
          PRISMA_SKIP_POSTINSTALL_GENERATE: 1
        run: npm ci

      - name: Apply database migrations (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          for i in 1 2 3; do
            if npx prisma migrate deploy; then
              exit 0
            fi
            echo "migrate deploy attempt $i failed, retrying (Neon cold start)..."
            sleep 10
          done
          exit 1

      - name: Build (OpenNext for Cloudflare)
        env:
          NODE_ENV: production
          # Variables públicas que se inlinean en el bundle del cliente. Si están
          # vacías, el código usa los valores por defecto (agente local en
          # http://127.0.0.1:8787, sin token).
          NEXT_PUBLIC_ARIA_LOCAL_AGENT: ${{ secrets.NEXT_PUBLIC_ARIA_LOCAL_AGENT }}
          NEXT_PUBLIC_ARIA_LOCAL_TOKEN: ${{ secrets.NEXT_PUBLIC_ARIA_LOCAL_TOKEN }}
        run: npx opennextjs-cloudflare build

      - name: Patch handler.mjs for native WASM import
        run: node scripts/patch-opennext-wasm.mjs

      - name: Deploy to Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL
          echo "${{ secrets.GROQ_API_KEY }}" | npx wrangler secret put GROQ_API_KEY
          # Sin claves de busqueda web obligatorias: `web_search` usa Firecrawl
          # en modo keyless (busqueda general y noticias) mas APIs keyless
          # (Wikipedia, Stack Exchange, Hacker News, MDN, endoflife.date y
          # GitHub Releases), todas gratuitas.
          #
          # Opcional: si se define el secret FIRECRAWL_API_KEY (tier gratis de
          # 1.000 creditos/mes), `web_search` la usa sola y sube el limite keyless
          # por IP. No hace falta para que funcione.
          if [ -n "${{ secrets.FIRECRAWL_API_KEY }}" ]; then
            echo "${{ secrets.FIRECRAWL_API_KEY }}" | npx wrangler secret put FIRECRAWL_API_KEY
          fi
          # Control de acceso. Si ARIA_ACCESS_TOKEN esta definido (aqui o con
          # `wrangler secret put`), toda la API exige `Authorization: Bearer`.
          # Sin el, la app queda abierta: la URL es publica y cualquiera podria
          # gastar la cuota de Groq y leer/escribir conversaciones.
          if [ -n "${{ secrets.ARIA_ACCESS_TOKEN }}" ]; then
            echo "${{ secrets.ARIA_ACCESS_TOKEN }}" | npx wrangler secret put ARIA_ACCESS_TOKEN
          fi
          # WhatsApp Cloud API (Meta). Sin estos secrets el webhook responde 200
          # sin hacer nada, y ARIA no lee ni responde mensajes de WhatsApp.
          if [ -n "${{ secrets.WHATSAPP_TOKEN }}" ]; then
            echo "${{ secrets.WHATSAPP_TOKEN }}" | npx wrangler secret put WHATSAPP_TOKEN
          fi
          if [ -n "${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" ]; then
            echo "${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" | npx wrangler secret put WHATSAPP_PHONE_NUMBER_ID
          fi
          if [ -n "${{ secrets.WHATSAPP_VERIFY_TOKEN }}" ]; then
            echo "${{ secrets.WHATSAPP_VERIFY_TOKEN }}" | npx wrangler secret put WHATSAPP_VERIFY_TOKEN
          fi
          if [ -n "${{ secrets.WHATSAPP_APP_SECRET }}" ]; then
            echo "${{ secrets.WHATSAPP_APP_SECRET }}" | npx wrangler secret put WHATSAPP_APP_SECRET
          fi
          if [ -n "${{ secrets.WHATSAPP_ALLOWED_NUMBERS }}" ]; then
            echo "${{ secrets.WHATSAPP_ALLOWED_NUMBERS }}" | npx wrangler secret put WHATSAPP_ALLOWED_NUMBERS
          fi
          # Correo saliente vía Resend (free tier). Con RESEND_API_KEY y
          # EMAIL_FROM, la herramienta send_email funciona.
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY
          fi
          if [ -n "${{ secrets.EMAIL_FROM }}" ]; then
            echo "${{ secrets.EMAIL_FROM }}" | npx wrangler secret put EMAIL_FROM
          fi
          if [ -n "${{ secrets.EMAIL_ALLOWED_TO }}" ]; then
            echo "${{ secrets.EMAIL_ALLOWED_TO }}" | npx wrangler secret put EMAIL_ALLOWED_TO
          fi