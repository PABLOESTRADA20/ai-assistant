name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: ./ai-assistant

    steps:
      - uses: actions/checkout@v7

      - name: ARIA_ACCESS_TOKEN es obligatorio (fail-closed)
        env:
          ARIA_ACCESS_TOKEN: ${{ secrets.ARIA_ACCESS_TOKEN }}
        run: |
          if [ -z "$ARIA_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secret ARIA_ACCESS_TOKEN. En produccion la app debe estar cerrada, asi que el deploy aborta. Agregalo en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./ai-assistant/package-lock.json

      - name: Install dependencies
        env:
          NODE_ENV: development
          PRISMA_SKIP_POSTINSTALL_GENERATE: 1
        run: npm ci

      - name: Apply database migrations (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          for i in 1 2 3; do
            if npx prisma migrate deploy; then
              exit 0
            fi
            echo "migrate deploy attempt $i failed, retrying (Neon cold start)..."
            sleep 10
          done
          exit 1

      - name: Build (OpenNext for Cloudflare)
        env:
          NODE_ENV: production
          # Única variable pública que se inlinea en el bundle del cliente. Es
          # solo una URL (no un secreto): por defecto el código usa
          # http://127.0.0.1:8787. El token del agente NUNCA se hornea en el
          # bundle; el navegador lo pide una vez y lo guarda en localStorage.
          NEXT_PUBLIC_ARIA_LOCAL_AGENT: ${{ secrets.NEXT_PUBLIC_ARIA_LOCAL_AGENT }}
        run: npm run build:worker

      - name: Deploy to Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Aviso de configuración de WhatsApp
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
        run: |
          if [ -n "$WHATSAPP_TOKEN" ] && [ -z "$WHATSAPP_APP_SECRET" ]; then
            echo "::warning::WHATSAPP_TOKEN está definido pero falta WHATSAPP_APP_SECRET. El webhook no procesará mensajes."
          fi

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SECRET_ARIA_ACCESS_TOKEN: ${{ secrets.ARIA_ACCESS_TOKEN }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SECRET_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SECRET_ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SECRET_FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SECRET_WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          SECRET_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          SECRET_WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          SECRET_WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          SECRET_WHATSAPP_ALLOWED_NUMBERS: ${{ secrets.WHATSAPP_ALLOWED_NUMBERS }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SECRET_EMAIL_ALLOWED_TO: ${{ secrets.EMAIL_ALLOWED_TO }}
          SECRET_ARIA_GITHUB_TOKEN: ${{ secrets.ARIA_GITHUB_TOKEN }}
          SECRET_GITHUB_WRITE_ENABLED: ${{ secrets.GITHUB_WRITE_ENABLED }}
        run: |
          put() {
            printf '%s' "$2" | npx wrangler secret put "$1"
          }
          put_if_set() {
            if [ -n "$2" ]; then
              put "$1" "$2"
            fi
          }

          put DATABASE_URL "$SECRET_DATABASE_URL"
          put GROQ_API_KEY "$SECRET_GROQ_API_KEY"
          put ARIA_ACCESS_TOKEN "$SECRET_ARIA_ACCESS_TOKEN"

          # Proveedores gratis adicionales. Todos opcionales: si el secret no
          # existe, sus modelos simplemente no aparecen en la app.
          put_if_set GEMINI_API_KEY "$SECRET_GEMINI_API_KEY"
          put_if_set MISTRAL_API_KEY "$SECRET_MISTRAL_API_KEY"
          put_if_set OPENROUTER_API_KEY "$SECRET_OPENROUTER_API_KEY"
          put_if_set ZAI_API_KEY "$SECRET_ZAI_API_KEY"
          put_if_set FIRECRAWL_API_KEY "$SECRET_FIRECRAWL_API_KEY"

          # WhatsApp Cloud API (Meta). Sin WHATSAPP_TOKEN y PHONE_NUMBER_ID el
          # webhook responde 200 sin hacer nada. WHATSAPP_APP_SECRET es
          # obligatorio para procesar mensajes.
          put_if_set WHATSAPP_TOKEN "$SECRET_WHATSAPP_TOKEN"
          put_if_set WHATSAPP_PHONE_NUMBER_ID "$SECRET_WHATSAPP_PHONE_NUMBER_ID"
          put_if_set WHATSAPP_VERIFY_TOKEN "$SECRET_WHATSAPP_VERIFY_TOKEN"
          put_if_set WHATSAPP_APP_SECRET "$SECRET_WHATSAPP_APP_SECRET"
          put_if_set WHATSAPP_ALLOWED_NUMBERS "$SECRET_WHATSAPP_ALLOWED_NUMBERS"

          # Correo saliente vía Resend (free tier).
          put_if_set RESEND_API_KEY "$SECRET_RESEND_API_KEY"
          put_if_set EMAIL_FROM "$SECRET_EMAIL_FROM"
          put_if_set EMAIL_ALLOWED_TO "$SECRET_EMAIL_ALLOWED_TO"

          # GitHub (opcional). El secret del repo se llama ARIA_GITHUB_TOKEN
          # porque "GITHUB_TOKEN" está reservado por Actions; aquí se mapea al
          # secret GITHUB_TOKEN que lee el Worker.
          put_if_set GITHUB_TOKEN "$SECRET_ARIA_GITHUB_TOKEN"
          if [ "$SECRET_GITHUB_WRITE_ENABLED" = "true" ]; then
            put GITHUB_WRITE_ENABLED true
          else
            put GITHUB_WRITE_ENABLED false
          fi
