name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generar el andamiaje de Android y copiar el codigo
        run: |
          set -e
          rm -rf build_src
          flutter create --org com.pabloestrada --project-name aria_app --platforms=android --no-pub build_src
          rm -rf build_src/lib
          cp -r mobile/lib build_src/lib
          cp mobile/pubspec.yaml build_src/pubspec.yaml

      - name: Instalar dependencias
        working-directory: build_src
        run: flutter pub get

      - name: Compilar APK de release
        working-directory: build_src
        run: flutter build apk --release

      - name: Reunir el APK
        run: cp build_src/build/app/outputs/flutter-apk/app-release.apk ARIA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ARIA-apk
          path: ARIA.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: ARIA Android v${{ github.run_number }}
          body: |
            Descargá **ARIA.apk** y abrilo en el celular para instalar.
            Si Android avisa que es de origen desconocido, permití la instalación.
          files: ARIA.apk
          make_latest: true
