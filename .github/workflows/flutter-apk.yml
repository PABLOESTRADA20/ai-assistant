name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Generar el andamiaje de Android y copiar el codigo
        run: |
          set -e
          rm -rf build_src
          flutter create --org com.pabloestrada --project-name aria_app --platforms=android --no-pub build_src
          rm -rf build_src/lib
          cp -r mobile/lib build_src/lib
          cp mobile/pubspec.yaml build_src/pubspec.yaml

      - name: Preparar el manifiesto (nombre ARIA + permiso de Internet)
        run: |
          MANIFEST=build_src/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="aria_app"/android:label="ARIA"/' "$MANIFEST"
          python3 - "$MANIFEST" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                         s, count=1)
              open(p, 'w', encoding='utf-8').write(s)
              print('Permiso INTERNET agregado')
          else:
              print('El permiso INTERNET ya estaba')
          PY
          grep -nE 'uses-permission|android:label' "$MANIFEST"

      - name: Instalar dependencias
        working-directory: build_src
        run: flutter pub get

      - name: Compilar APK de release (por arquitectura)
        working-directory: build_src
        run: flutter build apk --release --split-per-abi

      - name: Reunir los APK
        run: |
          cp build_src/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ARIA-arm64-v8a.apk
          cp build_src/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ARIA-armeabi-v7a.apk
          cp build_src/build/app/outputs/flutter-apk/app-x86_64-release.apk ARIA-x86_64.apk
          ls -lh ARIA-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ARIA-apk
          path: ARIA-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: ARIA Android v${{ github.run_number }}
          body: |
            Elegí el APK según tu celular (casi todos son **arm64-v8a**):
            - `ARIA-arm64-v8a.apk` → celulares modernos (recomendado)
            - `ARIA-armeabi-v7a.apk` → celulares viejos de 32 bits
            - `ARIA-x86_64.apk` → emuladores / PC

            Abrilo en el celular para instalar. Si Android avisa que es de origen
            desconocido, permití la instalación.
          files: ARIA-*.apk
          make_latest: true

      # El APK tambien se sirve desde el dominio propio de ARIA (/apk/...), que
      # es de donde lo baja la gente en el celular: GitHub redirige a
      # release-assets.githubusercontent.com y esa descarga se trababa.
      - name: Publicar los APK en el dominio de ARIA
        run: |
          set -e
          mkdir -p ai-assistant/public/apk
          cp ARIA-arm64-v8a.apk ARIA-armeabi-v7a.apk ai-assistant/public/apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-assistant/public/apk
          if git diff --cached --quiet; then
            echo "Los APK del dominio ya estaban actualizados."
          else
            # Sin [skip ci]: este commit tiene que disparar el Deploy para que
            # el dominio sirva la version nueva.
            git commit -m "chore: actualiza los APK en el dominio de ARIA"
            git push origin main
          fi
