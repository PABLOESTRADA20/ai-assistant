name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo en la misma rama/PR cancela el run anterior en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./ai-assistant/package-lock.json

      - name: Install dependencies
        env:
          NODE_ENV: development
          # El cliente generado (app/generated/prisma) está commiteado: no hace
          # falta `prisma generate` en el postinstall (mismo patrón que deploy.yml).
          PRISMA_SKIP_POSTINSTALL_GENERATE: 1
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-assistant
    env:
      # Base de pruebas aislada (p. ej. aria_test en Neon). Si el secret no
      # está definido queda vacío y los pasos se omiten con un aviso: los
      # tests NUNCA tocan la base de producción.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./ai-assistant/package-lock.json

      - name: Install dependencies
        env:
          NODE_ENV: development
          PRISMA_SKIP_POSTINSTALL_GENERATE: 1
        run: npm ci

      # Migra la BD de pruebas (con reintentos por cold start de Neon) y
      # ejecuta tests/integration. Sin secret, este paso se salta.
      - name: Integration tests
        if: env.TEST_DATABASE_URL != ''
        run: npm run test:integration

      - name: Warn when integration tests are skipped
        if: env.TEST_DATABASE_URL == ''
        run: echo "::warning::TEST_DATABASE_URL secret not set: integration tests skipped"
