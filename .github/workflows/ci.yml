name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo en la misma rama/PR cancela el run anterior en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./ai-assistant/package-lock.json

      - name: Install dependencies
        env:
          NODE_ENV: development
          # El cliente generado (app/generated/prisma) está commiteado: no hace
          # falta `prisma generate` en el postinstall (mismo patrón que deploy.yml).
          PRISMA_SKIP_POSTINSTALL_GENERATE: 1
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-assistant

    # Postgres propio con pgvector (la misma imagen que docker-compose.yml):
    # los tests corren herméticamente, sin secretos y sin tocar Neon.
    # POSTGRES_DB deja creada la BD de pruebas; la extensión vector y el
    # esquema los aplica `prisma migrate deploy` dentro del paso de tests.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgres://postgres:aria@localhost:5432/aria_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./ai-assistant/package-lock.json

      - name: Install dependencies
        env:
          NODE_ENV: development
          # El cliente generado (app/generated/prisma) está commiteado: no hace
          # falta `prisma generate` en el postinstall (mismo patrón que deploy.yml).
          PRISMA_SKIP_POSTINSTALL_GENERATE: 1
        run: npm ci

      # Migra el service container (con reintentos) y ejecuta tests/integration
      # contra él. Siempre corre: no necesita ningún secret del repositorio.
      - name: Integration tests
        run: npm run test:integration
