# Postgres propio con pgvector: desarrollo local y VPS.
#
#   npm run db:up      levanta el servidor (imagen pgvector/pgvector:pg17)
#   npm run db:psql    consola psql en la BD de la app
#   npm run db:down    para el servidor (el volumen de datos persiste)
#
# Puerto 5433 para no chocar con un PostgreSQL ya instalado en la máquina
# (normalmente ocupa el 5432). La URL de pruebas para .env.local es:
#   TEST_DATABASE_URL=postgres://postgres:aria@localhost:5433/aria_test
#
# La extensión vector y el esquema completo los aplican las migraciones de
# Prisma (npm run test:integration las ejecuta solas); docker/init.sql solo
# crea la BD de pruebas al primer arranque del volumen.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Contraseña de desarrollo. En el VPS: define POSTGRES_PASSWORD en un
      # archivo .env al lado del compose (compose lo lee automáticamente).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aria}
      POSTGRES_DB: aria
    ports:
      - "5433:5432"
    volumes:
      - aria-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aria"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aria-pgdata:
